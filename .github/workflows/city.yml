name: Atualizar cidade de contribuições

on:
  schedule:
    - cron: "23 */3 * * *"   # a cada 3 horas, para acompanhar o tempo em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_city.py
      - .github/workflows/city.yml

permissions:
  contents: write

concurrency:
  group: city
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar a cidade com o calendário oficial
        run: python scripts/build_city.py --user ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar só se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/city-pt.svg assets/city-en.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cidade de contribuições"
            git pull --rebase
            git push
          fi
